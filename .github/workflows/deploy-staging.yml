name: Deploy to Staging

on:
    push:
        branches:
            - staging

jobs:
    ftp-deploy:
        runs-on: ubuntu-latest
        # The boilerplate repo is a template and must never deploy itself.
        # Client projects generated via bin/setup.sh live under a different
        # repository name, so the guard is true there and the deploy runs.
        if: github.repository != 'valentin-grenier/wp-boilerplate-fse'
        environment: staging
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Deploy Root Files
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  server: ${{ secrets.FTP_HOST }}
                  port: ${{ secrets.FTP_PORT }}
                  protocol: ${{ secrets.FTP_PROTOCOL }}
                  username: ${{ secrets.FTP_USER }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: ./
                  server-dir: ${{ secrets.FTP_SERVER_DIR }}
                  timeout: 60000
                  security: strict
                  # Root deploy ships only runtime root content (e.g. .well-known/security.txt).
                  # Everything listed below is VCS / CI / dev tooling and must never reach a live host.
                  exclude: |
                      wp-content/**
                      .git/**
                      .github/**
                      .claude/**
                      .ddev/**
                      node_modules/**
                      vendor/**
                      bin/**
                      docs/**
                      tests/**
                      CHANGELOG.md
                      README.md
                      LICENSE
                      composer.json
                      composer.lock
                      phpcs.xml.dist
                      phpstan.neon.dist
                      phpunit.xml.dist
                      wp-cli.yml
                      .editorconfig
                      .env.example
                      .gitignore
                      .markdownlint.json
                      .nvmrc

            - name: Deploy Theme
              # _dev/ is intentionally shipped with the theme (project requirement).
              # node_modules/ and .git* are excluded by the action's default ignore list.
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  server: ${{ secrets.FTP_HOST }}
                  port: ${{ secrets.FTP_PORT }}
                  protocol: ${{ secrets.FTP_PROTOCOL }}
                  username: ${{ secrets.FTP_USER }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: wp-content/themes/theme-fse/
                  server-dir: ${{ secrets.FTP_SERVER_DIR }}/wp-content/themes/theme-fse/
                  timeout: 60000
                  security: strict

            - name: Deploy Plugins
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  server: ${{ secrets.FTP_HOST }}
                  port: ${{ secrets.FTP_PORT }}
                  protocol: ${{ secrets.FTP_PROTOCOL }}
                  username: ${{ secrets.FTP_USER }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: wp-content/plugins/
                  server-dir: ${{ secrets.FTP_SERVER_DIR }}/wp-content/plugins/
                  timeout: 60000
                  security: strict
                  # Plugin source (src/, webpack, configs) is intentionally kept,
                  # mirroring the theme's _dev/. Only deps, logs, OS junk and DB dumps are dropped.
                  exclude: |
                      node_modules/**
                      vendor/**
                      *.log
                      .DS_Store
                      Thumbs.db
                      *.sql

            # Post-deployment health check
            - name: Health Check
              if: success()
              run: |
                  echo "🏥 Performing health check..."
                  if [ -n "${{ vars.STAGING_URL }}" ]; then
                      response=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}" || echo "000")
                      if [ "$response" = "200" ]; then
                          echo "✅ Health check passed - Site is responding (HTTP $response)"
                      else
                          echo "⚠️ Health check warning - Site returned HTTP $response"
                      fi
                  else
                      echo "⚠️ No staging URL configured for health check"
                  fi

            # Deployment summary
            - name: Deployment Summary
              if: always()
              run: |
                  echo "📊 Deployment Summary"
                  echo "=================="
                  echo "Environment: ${{ env.DEPLOYMENT_ENVIRONMENT }}"
                  echo "Status: ${{ job.status }}"
                  echo "Commit: ${{ steps.deploy-info.outputs.commit_short }}"
                  echo "Branch: ${{ steps.deploy-info.outputs.branch }}"
                  echo "Triggered by: ${{ github.actor }}"
                  echo "Started: ${{ steps.deploy-info.outputs.timestamp }}"
                  echo "Completed: $(date -u +%Y%m%d-%H%M%S)"

                  if [ "${{ job.status }}" = "success" ]; then
                      echo "✅ Staging deployment completed successfully!"
                      if [ -n "${{ vars.STAGING_URL }}" ]; then
                          echo "🌐 Site URL: ${{ vars.STAGING_URL }}"
                      fi
                  else
                      echo "❌ Staging deployment failed!"
                      echo "Check the logs above for detailed error information."
                  fi
