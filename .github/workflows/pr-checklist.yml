name: PR Checklist

# Fails the PR while the "## Manual testing" section of the description is
# missing, empty, or has an unchecked task. The reviewer ticks those steps; the
# check re-runs whenever the PR body is edited, without pushing a commit.
# Job name stays "Checklist complete": it is a required status check.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  checklist:
    name: Checklist complete
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Verify all manual testing items are ticked
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const match = body.match(/##\s*Manual testing\s*\n([\s\S]*?)(?=\n##\s|$)/i);
            if (!match) {
              core.setFailed('No "## Manual testing" section found in the PR description.');
              return;
            }

            const section = match[1];
            const unchecked = section.match(/^\s*(?:[-*]|\d+\.)\s*\[ \]/gm) || [];
            const checked   = section.match(/^\s*(?:[-*]|\d+\.)\s*\[[xX]\]/gm) || [];

            core.summary
              .addHeading('PR Checklist')
              .addRaw(`Checked: ${checked.length} — Unchecked: ${unchecked.length}`)
              .write();

            if (checked.length + unchecked.length === 0) {
              core.setFailed('The "## Manual testing" section has no task to tick.');
              return;
            }

            if (unchecked.length > 0) {
              core.setFailed(
                `${unchecked.length} manual testing item(s) still unchecked. ` +
                'Tick every box in the "## Manual testing" section before merging.'
              );
            }
