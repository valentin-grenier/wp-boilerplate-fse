name: PR Checklist

# Fails the PR if any task in the "## Checklist" section of the description
# is still unchecked. The check re-runs whenever the PR body is edited so
# authors can tick boxes and rerun without pushing a commit.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  checklist:
    name: Checklist complete
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Verify all checklist items are ticked
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const match = body.match(/##\s*Checklist\s*\n([\s\S]*?)(?=\n##\s|$)/i);
            if (!match) {
              core.setFailed('No "## Checklist" section found in the PR description.');
              return;
            }

            const section = match[1];
            const unchecked = section.match(/^\s*[-*]\s*\[ \]/gm) || [];
            const checked   = section.match(/^\s*[-*]\s*\[[xX]\]/gm) || [];

            core.summary
              .addHeading('PR Checklist')
              .addRaw(`Checked: ${checked.length} — Unchecked: ${unchecked.length}`)
              .write();

            if (unchecked.length > 0) {
              core.setFailed(
                `${unchecked.length} checklist item(s) still unchecked. ` +
                'Tick every box in the "## Checklist" section before merging.'
              );
            }
